<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission</title>
<link rel="stylesheet" href="css/style.css">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<main class="mission">

<header class="top">
  <div>
    <h1 id="missionTitle">Mission</h1>
    <p id="missionGoal">เป้าหมาย</p>
  </div>
  <div class="mission-count" id="missionCount">1 / 20</div>
  <div class="header-actions">
    <button data-music-button class="small" onclick="StepUpAudio.toggleMusic()">♫ เพลง: เปิด</button>
    <button data-sfx-button class="small" onclick="StepUpAudio.toggleSfx()">🔊 เสียง: เปิด</button>
    <button class="small" onclick="location.href='mission-select.html'">เลือก Mission</button>
    <button class="small" onclick="location.href='index.html'">HOME</button>
  </div>
</header>

<section class="think"><b>Think First:</b> <span id="thinkText">ลองมองเส้นทางก่อนกด RUN</span></section>

<section class="game-frame">
  <section class="stage">
    <div class="label">World 1 : Cat &amp; Mouse</div>
    <div id="board" class="board"></div>
  </section>

  <aside class="palette">
    <h3>Command Palette</h3>
    <div class="palette-buttons">
      <button class="cmd" data-command="up">
        <span class="cmd-arrow"><img src="assets/icons/arrow-up.svg" alt="" draggable="false"></span><span class="cmd-text">ขึ้น</span>
      </button>
      <button class="cmd" data-command="down">
        <span class="cmd-arrow"><img src="assets/icons/arrow-down.svg" alt="" draggable="false"></span><span class="cmd-text">ลง</span>
      </button>
      <button class="cmd" data-command="left">
        <span class="cmd-arrow"><img src="assets/icons/arrow-left.svg" alt="" draggable="false"></span><span class="cmd-text">ซ้าย</span>
      </button>
      <button class="cmd" data-command="right">
        <span class="cmd-arrow"><img src="assets/icons/arrow-right.svg" alt="" draggable="false"></span><span class="cmd-text">ขวา</span>
      </button>
      <button id="repeat2Btn" class="cmd repeat" data-command="repeat2">
        <span class="cmd-repeat">🔁</span><span class="cmd-text">ทำซ้ำ 2 ครั้ง</span>
      </button>
      <button id="repeat3Btn" class="cmd repeat" data-command="repeat3">
        <span class="cmd-repeat">🔁</span><span class="cmd-text">ทำซ้ำ 3 ครั้ง</span>
      </button>
    </div>
  </aside>
</section>

<section class="coding">
  <h3>Coding Area <small class="drag-help">ลาก วาง สลับ และกด × เพื่อลบ</small></h3>
  <div id="program" class="program">ลากบล็อกคำสั่งมาวางที่นี่ หรือแตะเพื่อเพิ่ม</div>
</section>

<section class="runbar">
  <button class="btn green" onclick="runProgram()">▶ RUN</button>
  <button class="btn blue" onclick="resetMission()">↺ ล้าง</button>
  <button class="btn purple" onclick="showHint()">💡 ลองคิดอีกที</button>
</section>

<section class="teacher-panel">
  <div class="teacher-title">🦉 Teacher Mode</div>
  <button class="teacher-btn" onclick="showTeacherHint()">คำแนะนำครู</button>
  <button class="teacher-btn" onclick="showSolution()">ดูคำตอบตัวอย่าง</button>
  <button class="teacher-btn" onclick="undoCommand()">↶ Undo</button>
  <button class="teacher-btn" onclick="clearOne()">ลบบล็อกล่าสุด</button>
  <button class="teacher-btn" onclick="resetMission()">เริ่มต้นใหม่</button>
  <button class="teacher-btn" onclick="skipMission()">ข้ามด่าน</button>
</section>

<div id="modal" class="modal hidden">
  <div class="complete">
    <div class="sparkles">✨ ⭐ ✨</div>
    <h2 id="completeTitle">ยินดีด้วย!</h2>
    <p id="completeText" class="praise-text">หนูเก่งมาก!</p>
    <button id="nextBtn" class="btn green" onclick="nextMission()">ด่านถัดไป</button>
    <button class="btn blue" onclick="location.href='mission-select.html'">เลือก Mission</button>
    <button class="btn purple" onclick="location.href='index.html'">กลับ HOME</button>
  </div>
</div>

</main>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
